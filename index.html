<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판타지 지도 생성기</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>판타지 지도 생성기</h1>
        <p class="sub">같은 시드는 항상 같은 지도를 만듭니다.</p>

        <form id="controls" autocomplete="off">
          <label class="field">
            <span>시드</span>
            <div class="row">
              <input id="seed" name="seed" type="text" maxlength="40" required />
              <button type="button" id="random" title="무작위 시드">무작위</button>
            </div>
          </label>

          <label class="field">
            <span>지명 스타일</span>
            <select id="nameStyle" name="nameStyle">
              <option value="korean">한국어풍</option>
              <option value="western">서구 판타지풍</option>
            </select>
          </label>

          <label class="field">
            <span>지형</span>
            <select id="shape" name="shape">
              <option value="continent">대륙</option>
              <option value="archipelago">군도</option>
            </select>
          </label>

          <label class="field">
            <span>육지 비율 <output for="landRatio" id="landRatioOut"></output></span>
            <input id="landRatio" name="landRatio" type="range" min="0.2" max="0.65" step="0.01" />
          </label>

          <label class="field">
            <span>국가 수 <output for="states" id="statesOut"></output></span>
            <input id="states" name="states" type="range" min="1" max="14" step="1" />
          </label>

          <label class="field">
            <span>국가당 도시 <output for="citiesPerState" id="citiesPerStateOut"></output></span>
            <input id="citiesPerState" name="citiesPerState" type="range" min="0" max="10" step="1" />
          </label>

          <label class="field">
            <span>기후 <output for="temperatureShift" id="temperatureShiftOut"></output></span>
            <input id="temperatureShift" name="temperatureShift" type="range" min="-0.3" max="0.3" step="0.02" />
          </label>

          <label class="field">
            <span>정밀도(셀 수) <output for="cells" id="cellsOut"></output></span>
            <input id="cells" name="cells" type="range" min="3000" max="20000" step="1000" />
          </label>

          <button type="submit" class="primary">지도 생성</button>
        </form>

        <fieldset class="editor" id="editor">
          <legend>편집</legend>
          <label class="toggle"><input type="checkbox" id="editMode" /> 편집 모드 <kbd>E</kbd></label>
          <div class="tabs" role="tablist" aria-label="편집 대상">
            <button type="button" role="tab" data-target="terrain" aria-selected="true">지형</button>
            <button type="button" role="tab" data-target="city" aria-selected="false">도시</button>
            <button type="button" role="tab" data-target="border" aria-selected="false">국경</button>
            <button type="button" role="tab" data-target="infra" aria-selected="false">시설</button>
          </div>

          <div class="tab-panel" data-panel="terrain">
            <div class="tools" role="radiogroup" aria-label="지형 도구">
              <label><input type="radio" name="tool" value="raise" checked /> 융기</label>
              <label><input type="radio" name="tool" value="lower" /> 침강</label>
              <label><input type="radio" name="tool" value="flatten" /> 평탄화</label>
              <label><input type="radio" name="tool" value="smooth" /> 부드럽게</label>
            </div>
          </div>

          <div class="tab-panel" data-panel="city" hidden>
            <div class="tools" role="radiogroup" aria-label="도시 도구">
              <label><input type="radio" name="cityTool" value="move" checked /> 이동</label>
              <label><input type="radio" name="cityTool" value="add" /> 추가</label>
              <label><input type="radio" name="cityTool" value="delete" /> 삭제</label>
              <label><input type="radio" name="cityTool" value="rename" /> 이름 바꾸기</label>
              <label><input type="radio" name="cityTool" value="capital" /> 수도 지정</label>
              <label><input type="radio" name="cityTool" value="newState" /> 새 국가</label>
            </div>
          </div>

          <div class="tab-panel" data-panel="border" hidden>
            <label class="field">
              <span>칠할 국가</span>
              <select id="paintState"></select>
            </label>
            <button type="button" id="renameState" class="wide">선택한 국가 이름 바꾸기</button>
            <details class="danger-zone">
              <summary>국가 없애기</summary>
              <label class="field">
                <span>영토를 넘길 곳</span>
                <select id="mergeInto"></select>
              </label>
              <button type="button" id="deleteState" class="wide">선택한 국가 없애기</button>
            </details>
          </div>

          <div class="tab-panel" data-panel="infra" hidden>
            <div class="tools" role="radiogroup" aria-label="시설 도구">
              <label><input type="radio" name="infraTool" value="road" checked /> 도로</label>
              <label><input type="radio" name="infraTool" value="rail" /> 철도</label>
              <label><input type="radio" name="infraTool" value="sea" /> 항로</label>
              <label><input type="radio" name="infraTool" value="port" /> 항구</label>
              <label><input type="radio" name="infraTool" value="facility" /> 시설물</label>
              <label><input type="radio" name="infraTool" value="move" /> 이동</label>
              <label><input type="radio" name="infraTool" value="erase" /> 지우기</label>
            </div>
            <label class="field" id="facilityKindField">
              <span>시설 종류</span>
              <select id="facilityKind">
                <option value="castle">성</option>
                <option value="fort">요새</option>
                <option value="temple">사원</option>
                <option value="mine">광산</option>
                <option value="tower">탑</option>
                <option value="ruin">유적</option>
                <option value="lighthouse">등대 (해안)</option>
              </select>
            </label>
            <label class="field" id="featureNameField">
              <span>이름 (선택, 놓을 때 붙음)</span>
              <input id="featureName" type="text" maxlength="20" placeholder="비워 두면 이름 없음" />
            </label>
            <button type="button" id="resetRoads" class="wide">도로 자동 배치로</button>
          </div>

          <p class="hint" id="toolHint"></p>
          <div id="brushFields">
            <label class="field">
              <span>브러시 크기 <output id="brushSizeOut"></output></span>
              <input id="brushSize" type="range" min="10" max="160" step="5" value="45" />
            </label>
            <label class="field" id="strengthField">
              <span>세기 <output id="brushStrengthOut"></output></span>
              <input id="brushStrength" type="range" min="0.1" max="1" step="0.05" value="0.5" />
            </label>
          </div>
          <div class="row">
            <button type="button" id="undo" title="되돌리기 (Ctrl+Z)">되돌리기</button>
            <button type="button" id="redo" title="다시 하기 (Ctrl+Shift+Z)">다시 하기</button>
          </div>
          <div class="row">
            <button type="button" id="resetEdits" title="시드 지형으로 되돌리기">지형 초기화</button>
            <button type="button" id="resetCiv" title="직접 편집한 도시·국경을 버리고 자동 배치로">자동 배치로</button>
          </div>
        </fieldset>

        <fieldset class="layers">
          <legend>레이어</legend>
          <label><input type="checkbox" data-layer="relief" /> 고도 음영</label>
          <label><input type="checkbox" data-layer="rivers" /> 강</label>
          <label><input type="checkbox" data-layer="borders" /> 국경</label>
          <label><input type="checkbox" data-layer="stateTint" /> 국가 색</label>
          <label><input type="checkbox" data-layer="roads" /> 도로</label>
          <label><input type="checkbox" data-layer="rails" /> 철도</label>
          <label><input type="checkbox" data-layer="seaRoutes" /> 항로</label>
          <label><input type="checkbox" data-layer="facilities" /> 항구·시설</label>
          <label><input type="checkbox" data-layer="cities" /> 도시</label>
          <label><input type="checkbox" data-layer="labels" /> 지명</label>
        </fieldset>

        <div class="row export">
          <button type="button" id="exportPng">PNG 저장</button>
          <button type="button" id="exportJson">JSON 저장</button>
          <button type="button" id="copyLink">링크 복사</button>
          <button type="button" id="importJson">JSON 불러오기</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
        </div>

        <section class="info" aria-live="polite">
          <h2>정보</h2>
          <dl id="cellInfo"><dt>안내</dt><dd>지도 위에 마우스를 올려 보세요.</dd></dl>
          <p id="status" class="status"></p>
        </section>
      </aside>

      <main class="stage">
        <div class="map-wrap">
          <canvas id="map" width="1200" height="800" aria-label="생성된 판타지 지도"></canvas>
          <canvas id="overlay" width="1200" height="800" aria-hidden="true"></canvas>
        </div>
        <section class="legend" id="legend" aria-label="국가 목록"></section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
